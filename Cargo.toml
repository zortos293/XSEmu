[workspace]
resolver = "2"
members = ["crates/xcl", "crates/xcl-bcpack", "tests/testtitle", "tests/testgamedll"]
# The direct DXIL backend is its own workspace: no dependencies, builds and tests on Linux.
# crates/xcl-cgbj is CGBJ's shader translator (GPL-3.0-or-later, see its PROVENANCE.md): its own
# workspace too, and not yet a dependency of xcl.
exclude = ["crates/xcl-dxil", "crates/xcl-cgbj"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Keep full symbols in optimized alpha builds so release-only crashes can be
# resolved to functions, files, and lines without a separate diagnostic build.
[profile.release]
debug = 2
